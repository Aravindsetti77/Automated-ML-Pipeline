name: MLOps Training Pipeline

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      target_variable:
        description: 'Prediction Target'
        required: true
        default: 'Stock Price'
        type: choice
        options:
          - 'Stock Price'
          - 'Revenue'
      model_type:
        description: 'Model to Train'
        required: true
        default: 'RandomForest'
        type: choice
        options:
          - 'RandomForest'
          - 'GradientBoosting'
          - 'LinearRegression'
          - 'SVR'
          - 'KNeighbors'
          - 'DecisionTree'
      visualization_type:
        description: 'Graph Visualization'
        required: true
        default: 'Scatter Plot'
        type: choice
        options:
          - 'Scatter Plot'
          - 'Residual Plot'
          - 'Error Histogram'
          - 'Line Chart'
      ticker:
        description: 'Stock Ticker (e.g., AAPL)'
        required: true
        default: 'AAPL'
        type: string
jobs:
  train-and-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Fetch Financial Data
      env:
        TARGET_VARIABLE: ${{ github.event.inputs.target_variable || 'Stock Price' }}
        TICKER: ${{ github.event.inputs.ticker || 'AAPL' }}
      run: python Script/fetch_data.py
        
    - name: Train AI Model
      env:
        TARGET_VARIABLE: ${{ github.event.inputs.target_variable || 'Stock Price' }}
        MODEL_TYPE: ${{ github.event.inputs.model_type || 'RandomForest' }}
        VISUALIZATION_TYPE: ${{ github.event.inputs.visualization_type || 'Scatter Plot' }}
        TICKER: ${{ github.event.inputs.ticker || 'AAPL' }}
      run: python Script/train.py
        
    - name: Publish Metrics to GitHub Summary
      run: cat metrics.md >> $GITHUB_STEP_SUMMARY

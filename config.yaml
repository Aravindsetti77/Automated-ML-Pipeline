data:
  raw_data_path: "Data/financial_data.csv"
model:
  model_dir: "model"
  model_path: "model/financial_model.joblib"
train:
  test_size: 0.2
  random_state: 42
  target_column: "Target"
  param_grids:
    RandomForest:
      n_estimators: [50, 100]
      max_depth: [5, 10, null]
    GradientBoosting:
      n_estimators: [50, 100]
      learning_rate: [0.01, 0.1]
    LinearRegression:
      fit_intercept: [True, False]
    SVR:
      kernel: ['linear', 'rbf']
      C: [0.1, 1.0, 10.0]
    KNeighbors:
      n_neighbors: [3, 5, 7]
      weights: ['uniform', 'distance']
    DecisionTree:
      max_depth: [null, 5, 10, 20]
      min_samples_split: [2, 5, 10]
reports:
  dir: "reports"
  drift_report_path: "reports/drift_report.html"

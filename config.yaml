data:
  raw_data_path: "Data/synthetic_fraud_data.csv"
model:
  model_dir: "model"
  model_path: "model/fraud_model.joblib"
train:
  test_size: 0.2
  random_state: 42
  target_column: "fraud"
  param_grid:
    n_estimators: [50, 100, 200]
    max_depth: [5, 10, 20]
reports:
  dir: "reports"
  drift_report_path: "reports/drift_report.html"
